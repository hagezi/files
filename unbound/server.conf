# ------------------------------------------------------------
# Unbound Configuration
# Version: 1.0.2 / 2026-10-29
# Docs:    https://nlnetlabs.nl/documentation/unbound/unbound.conf/
#
# Required sysctl for socket buffers (/etc/sysctl.d/99-unbound.conf):
#   net.core.rmem_max = 4194304
#   net.core.wmem_max = 4194304
# ------------------------------------------------------------
server:
    # Modules
    module-config: "validator iterator"

    # Root
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: yes
    log-local-actions: no
    log-time-ascii: yes
    val-log-level: 2
    logfile: ""

    # Interface
    interface: 127.0.0.1
    port: 5335

    # Protocols
    do-ip6: yes
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no
    prefer-ip4: yes

    # Process
    do-daemonize: no

    # Errors (EDE)
    ede: yes
    ede-serve-expired: yes

    # Statistics
    extended-statistics: yes

    # Buffers
    edns-buffer-size: 1232
    max-udp-size: 1232
    so-rcvbuf: 4m
    so-sndbuf: 4m

    # Cache/Performance
    cache-max-ttl: 259200
    cache-min-ttl: 30
    cache-min-negative-ttl: 300
    cache-max-negative-ttl: 3600
    fast-server-num: 3
    fast-server-permil: 950
    incoming-num-tcp: 256
    infra-cache-numhosts: 50000
    infra-host-ttl: 900
    infra-keep-probing: yes
    key-cache-size: 32m
    minimal-responses: yes
    msg-cache-size: 128m
    neg-cache-size: 16m
    num-queries-per-thread: 2048
    outgoing-num-tcp: 256
    outgoing-range: 4096
    prefetch-key: yes
    prefetch: yes
    rrset-cache-size: 256m
    serve-expired-client-timeout: 0
    serve-expired-reply-ttl: 30
    serve-expired-ttl-reset: no
    serve-expired-ttl: 21600
    serve-expired: yes
    so-reuseport: yes
    target-fetch-policy: "3 2 1 1 1"

    # Threading
    num-threads: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2

    # Recursion
    discard-timeout: 5000

    # Security/Privacy
    aggressive-nsec: yes
    delay-close: 10000
    deny-any: yes
    do-not-query-localhost: yes
    harden-algo-downgrade: no
    harden-below-nxdomain: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-large-queries: yes
    harden-referral-path: no
    harden-short-bufsize: yes
    hide-http-user-agent: no
    hide-identity: yes
    hide-version: yes
    http-user-agent: "DNS"
    identity: "DNS"
    qname-minimisation: yes
    rrset-roundrobin: yes
    unwanted-reply-threshold: 10000000
    use-caps-for-id: no
    val-clean-additional: yes

    # DNSSEC: Stop Unbound from blocking bogus answers?
    val-permissive-mode: no

    # Ratelimiting
    answer-cookie: yes
    ip-ratelimit-cookie: 0
    ip-ratelimit: 0
    ip-ratelimit-size: 16m
    ratelimit: 0
    ratelimit-size: 4m

    # Local (DNS rebinding protection)
    private-address: 0.0.0.0/8
    private-address: 10.0.0.0/8
    # CGNAT - breaks Tailscale
    # private-address: 100.64.0.0/10
    private-address: 127.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: fc00::/7
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    # Access
    access-control: 127.0.0.0/8 allow

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953

# Local copy of the DNS root zone (RFC 8806)
auth-zone:
    name: "."
    primary: 170.247.170.2        # b.root-servers.net
    primary: 192.33.4.12          # c.root-servers.net
    primary: 199.7.91.13          # d.root-servers.net
    primary: 192.5.5.241          # f.root-servers.net
    primary: 192.112.36.4         # g.root-servers.net
    primary: 198.97.190.53        # h.root-servers.net
    primary: 193.0.14.129         # k.root-servers.net
    primary: 192.0.47.132         # xfr.cjr.dns.icann.org
    primary: 192.0.32.132         # xfr.lax.dns.icann.org

    primary: 2801:1b8:10::b       # b.root-servers.net
    primary: 2001:500:2::c        # c.root-servers.net
    primary: 2001:500:2d::d       # d.root-servers.net
    primary: 2001:500:2f::f       # f.root-servers.net
    primary: 2001:500:12::d0d     # g.root-servers.net
    primary: 2001:500:1::53       # h.root-servers.net
    primary: 2001:7fd::1          # k.root-servers.net
    primary: 2620:0:2830:202::132 # xfr.cjr.dns.icann.org
    primary: 2620:0:2d0:202::132  # xfr.lax.dns.icann.org

    zonemd-check: yes
    zonemd-reject-absence: yes

    fallback-enabled: yes
    for-downstream: no
    for-upstream: yes

    zonefile: /var/lib/unbound/root.zone
