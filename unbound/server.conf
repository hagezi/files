# -------------------------------------------------------------------------
# Unbound Configuration
# Version: 1.1.0 / 2026-10-31
# Author:  HaGeZi
# Docs:
#   https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
#
# Recursive, DNSSEC-validating resolver with a local copy of the root zone.
# The comments name the RFC an option is based on. Options that deliberately
# deviate from an RFC are marked with "DEVIATION".
#
# Options with Unbound's default value are left out, except where the value
# is security or RFC relevant: they are kept to document the intent and to
# stay independent of future default changes.
#
# Minimum:     Unbound 1.20 (cache-min-negative-ttl, discard-timeout).
#              Older versions need these options removed; further options
#              by version: ede, ede-serve-expired 1.16; zonemd-check,
#              zonemd-reject-absence 1.13.2; primary 1.12 (before: master).
# Recommended: the latest Unbound release (security fixes), at least
#              1.25.2 (fix for CVE-2026-56444, see discard-timeout).
#              Option names checked against the Unbound 1.26.2 source.
#
# Always check the configuration before starting or restarting Unbound;
# an invalid file stops Unbound from starting:
#   sudo unbound-checkconf /etc/unbound/unbound.conf
#   sudo systemctl restart unbound
#
# Required sysctl for socket buffers (/etc/sysctl.d/99-unbound.conf):
#   net.core.rmem_max = 4194304
#   net.core.wmem_max = 4194304
# -------------------------------------------------------------------------
server:
    # ---------------------------------------------------------------------
    # Interface and process
    # ---------------------------------------------------------------------
    # Only reachable locally, e.g. as upstream for Pi-hole (127.0.0.1#5335).
    # Unbound's default access control allows localhost and refuses all
    # other clients.
    interface: 127.0.0.1
    port: 5335
    # Run in the foreground, the service manager (systemd) handles it
    do-daemonize: no
    # Number of threads, at most one per CPU core. The cache slabs are set
    # automatically to a power of 2 close to this value.
    num-threads: 2

    # ---------------------------------------------------------------------
    # Logging and statistics
    # ---------------------------------------------------------------------
    # Log every SERVFAIL with its reason
    log-servfail: yes
    # Readable timestamps instead of Unix time
    log-time-ascii: yes
    # 2 = log DNSSEC validation failures with the reason and the server
    # that sent the faulty data
    val-log-level: 2
    # Detailed statistics for unbound-control stats
    extended-statistics: yes

    # ---------------------------------------------------------------------
    # Extended DNS Errors
    # ---------------------------------------------------------------------
    # Reason of a failure in the reply (RFC 8914)
    ede: yes
    # EDE 3 "Stale Answer" for expired data from the cache (RFC 8914, RFC 8767)
    ede-serve-expired: yes

    # ---------------------------------------------------------------------
    # DNSSEC
    # ---------------------------------------------------------------------
    # validator: DNSSEC validation (RFC 4033, RFC 4034, RFC 4035, RFC 6840)
    # iterator:  full recursion from the root (RFC 1034, RFC 1035)
    module-config: "validator iterator"
    # Trust anchor of the root zone (RFC 7958), kept up to date
    # automatically on key rollovers (RFC 5011)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    # Strict validation, bogus answers become SERVFAIL (RFC 4035)
    val-permissive-mode: no
    # Require DNSSEC data for zones with a trust anchor, stripped
    # signatures are treated as bogus (RFC 4035)
    harden-dnssec-stripped: yes
    # Accept any supported DNSSEC algorithm of a zone, as required by
    # RFC 6840 section 5.11 ("no" is the RFC compliant setting)
    harden-algo-downgrade: no
    # Remove data that is not signed properly from the additional section
    # of secure answers (RFC 4035)
    val-clean-additional: yes
    # Synthesize NXDOMAIN/NODATA from cached, validated NSEC/NSEC3 records
    # (RFC 8198)
    aggressive-nsec: yes
    # NXDOMAIN means nothing exists below the name (RFC 8020), only used
    # for DNSSEC-validated NXDOMAIN answers
    harden-below-nxdomain: yes
    # Fetch DNSKEY records early when a DS record is seen
    prefetch-key: yes
    # Cache for DNSSEC keys (DNSKEY, DS, RFC 4034)
    key-cache-size: 32m

    # ---------------------------------------------------------------------
    # Transport
    # ---------------------------------------------------------------------
    # Prefer IPv4 for queries to authoritative servers
    prefer-ip4: yes
    # EDNS UDP payload size (RFC 6891). 1232 bytes avoids IP fragmentation
    # (DNS Flag Day 2020); RFC 9715 recommends at most 1400 bytes, smaller
    # values allowed. Larger answers switch to TCP (RFC 7766).
    edns-buffer-size: 1232
    max-udp-size: 1232
    # Ignore EDNS buffer sizes below 512 bytes (RFC 6891)
    harden-short-bufsize: yes
    # Receive buffer of the UDP socket, requires the sysctl values in the
    # header (the send buffer is 4m by default)
    so-rcvbuf: 4m
    # TCP connections from clients and to authoritative servers (RFC 7766)
    incoming-num-tcp: 256
    outgoing-num-tcp: 256

    # ---------------------------------------------------------------------
    # Recursion and server selection
    # ---------------------------------------------------------------------
    # QNAME minimisation: send authoritative servers only the labels they
    # need (RFC 9156)
    qname-minimisation: yes
    # How many nameserver addresses are fetched in advance per delegation
    # depth (more = faster, but more queries)
    target-fetch-policy: "3 2 1 1 1"
    # Choose from the 3 fastest authoritative servers (default) for 95 % of
    # the queries, the rest goes to all servers for RTT measurement
    fast-server-permil: 950
    # Infrastructure cache: RTT and EDNS status of authoritative servers
    infra-cache-numhosts: 50000
    # Keep probing servers marked as down, so they are back in use quickly
    infra-keep-probing: yes
    # Drop the UDP reply of a query still unanswered after 5 s; recursion
    # continues and the result is cached for the retry. The default of
    # 1900 ms protects public resolvers against DNSBomb (CVE-2024-33655).
    # Only localhost can query here, so 5 s lets slow answers still reach
    # Pi-hole, matching the default 5 s timeout of the glibc stub resolver.
    # Must be larger than serve-expired-client-timeout.
    # Unbound 1.25.2 and later fix CVE-2026-56444 (discard-timeout combined
    # with serve-expired-client-timeout).
    discard-timeout: 5000

    # ---------------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------------
    # Upper limit for TTLs (3 days). Capping is allowed, RFC 8767 recommends
    # a cap of at most 7 days (604800 s)
    cache-max-ttl: 259200
    # DEVIATION: minimum TTL of 30 s. The TTL of the authoritative data is
    # binding (RFC 1035, RFC 2181), shorter TTLs are raised here.
    cache-min-ttl: 30
    # DEVIATION: minimum TTL for negative answers of 5 min. RFC 2308 uses
    # the lower of the SOA TTL and the SOA MINIMUM field.
    cache-min-negative-ttl: 300
    # Upper limit for negative answers (1 h), RFC 2308: 1 to 3 hours
    cache-max-negative-ttl: 3600
    # Cache sizes; the RRset cache should be about twice the message cache
    msg-cache-size: 128m
    rrset-cache-size: 256m
    # Cache for NSEC/NSEC3 records, used by aggressive-nsec (RFC 8198)
    neg-cache-size: 16m
    # Refresh popular entries before they expire (last 10 % of their TTL)
    prefetch: yes

    # ---------------------------------------------------------------------
    # Serve stale data (RFC 8767)
    # ---------------------------------------------------------------------
    serve-expired: yes
    # DEVIATION: 0 answers with expired data immediately and refreshes in
    # the background. RFC 8767 recommends a client response timer of 1.8 s
    # (1800), i.e. to try a fresh answer first.
    serve-expired-client-timeout: 0
    # TTL of expired answers, RFC 8767 recommends 30 s
    serve-expired-reply-ttl: 30
    # Do not extend the stale period when an expired entry is served
    serve-expired-ttl-reset: no
    # Serve data at most 6 h after expiry. RFC 8767 suggests 1 to 3 days,
    # a shorter period is more conservative.
    serve-expired-ttl: 21600

    # ---------------------------------------------------------------------
    # Spoofing and cache poisoning protection
    # ---------------------------------------------------------------------
    # Only trust glue records inside the delegated zone (RFC 5452)
    harden-glue: yes
    # Keep UDP ports of timed-out queries open for 10 s, so very late
    # answers do not hit closed ports and are not counted as unwanted
    delay-close: 10000
    # Clear the caches after this many unwanted replies (RFC 5452)
    unwanted-reply-threshold: 10000000

    # ---------------------------------------------------------------------
    # Query handling and privacy
    # ---------------------------------------------------------------------
    # DEVIATION: queries of type ANY get an empty answer. RFC 8482
    # recommends a minimal answer (one RRset or a synthesized HINFO).
    deny-any: yes
    # Accept large queries, they are legal with EDNS (RFC 6891)
    harden-large-queries: no
    # Do not answer id.server, hostname.bind and version.bind (RFC 4892)
    hide-identity: yes
    hide-version: yes

    # ---------------------------------------------------------------------
    # DNS rebinding protection
    # ---------------------------------------------------------------------
    # Public answers that contain private or special-use addresses are
    # removed. The mechanism itself is not defined by an RFC; every address
    # range below is specified by an RFC and listed in the IANA special-
    # purpose address registries (RFC 6890).
    # Comment out a range if it is used for public names in your network
    # (e.g. CGNAT for Tailscale) or add further ranges in the same format.
    # "This network" (RFC 1122, RFC 6890)
    private-address: 0.0.0.0/8
    # Private networks (RFC 1918)
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    # Shared address space / CGNAT (RFC 6598) - breaks Tailscale
    # private-address: 100.64.0.0/10
    # Loopback (RFC 1122)
    private-address: 127.0.0.0/8
    # Link local (RFC 3927)
    private-address: 169.254.0.0/16
    # IPv6 loopback, link local and IPv4-mapped addresses (RFC 4291)
    private-address: ::1/128
    private-address: fe80::/10
    private-address: ::ffff:0:0/96
    # IPv6 unique local addresses (RFC 4193)
    private-address: fc00::/7

    # Exceptions: these domains (incl. all subdomains) may return private
    # addresses. Each one weakens the rebinding protection for that domain,
    # so only enable what is needed: remove the leading "#" of the line.
    # Add further domains in the same format if necessary.
    #
    # DNS blocklists (DNSBL/RHSBL) answer with 127.0.0.x. Only needed if a
    # mail server or spam filter (rspamd, SpamAssassin) uses this resolver.
    # private-domain: "zen.spamhaus.org"
    # private-domain: "dbl.spamhaus.org"
    # private-domain: "bl.spamcop.net"
    # private-domain: "b.barracudacentral.org"
    # private-domain: "bl.mailspike.net"
    # private-domain: "psbl.surriel.com"
    # private-domain: "multi.uribl.com"
    # private-domain: "multi.surbl.org"
    #
    # Wi-Fi calling (VoWiFi): ePDG names of the mobile operators,
    # epdg.epc.mnc<MNC>.mcc<MCC>.pub.3gppnetwork.org. Normally public
    # addresses; only needed if an operator returns private ones.
    # private-domain: "pub.3gppnetwork.org"
    #
    # Plex: plex.direct resolves to the LAN address of the Plex server,
    # needed for direct connections inside the local network.
    # private-domain: "plex.direct"
    #
    # Developer services that resolve to any IP address or to 127.0.0.1
    # private-domain: "nip.io"
    # private-domain: "sslip.io"
    # private-domain: "localtest.me"
    # private-domain: "lvh.me"

# -------------------------------------------------------------------------
# Remote control (unbound-control) on 127.0.0.1, default port 8953
# -------------------------------------------------------------------------
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1

# -------------------------------------------------------------------------
# Local copy of the DNS root zone (RFC 8806)
# -------------------------------------------------------------------------
# The root zone is loaded by zone transfer (AXFR, RFC 5936) from the root
# servers that allow it and from ICANN. Queries for the root are answered
# from the local copy, which saves round trips and leaks no queries to the
# root servers.
auth-zone:
    name: "."
    primary: 170.247.170.2        # b.root-servers.net
    primary: 192.33.4.12          # c.root-servers.net
    primary: 199.7.91.13          # d.root-servers.net
    primary: 192.5.5.241          # f.root-servers.net
    primary: 192.112.36.4         # g.root-servers.net
    primary: 198.97.190.53        # h.root-servers.net
    primary: 193.0.14.129         # k.root-servers.net
    primary: 192.0.47.132         # xfr.cjr.dns.icann.org
    primary: 192.0.32.132         # xfr.lax.dns.icann.org

    primary: 2801:1b8:10::b       # b.root-servers.net
    primary: 2001:500:2::c        # c.root-servers.net
    primary: 2001:500:2d::d       # d.root-servers.net
    primary: 2001:500:2f::f       # f.root-servers.net
    primary: 2001:500:12::d0d     # g.root-servers.net
    primary: 2001:500:1::53       # h.root-servers.net
    primary: 2001:7fd::1          # k.root-servers.net
    primary: 2620:0:2830:202::132 # xfr.cjr.dns.icann.org
    primary: 2620:0:2d0:202::132  # xfr.lax.dns.icann.org

    # Verify the zone with its ZONEMD digest (RFC 8976) and reject a zone
    # without ZONEMD record
    zonemd-check: yes
    zonemd-reject-absence: yes

    # Fall back to normal recursion if the zone cannot be loaded
    fallback-enabled: yes
    # Do not answer clients directly from the zone (RFC 8806: the copy is
    # only used by the resolver itself); the default is yes. Together with
    # for-upstream, the zone data is DNSSEC validated before it is used.
    for-downstream: no
    # Use the zone for the resolver's own lookups (default)
    for-upstream: yes

    zonefile: /var/lib/unbound/root.zone
