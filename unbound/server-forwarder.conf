# -------------------------------------------------------------------------
# Unbound Configuration - Forwarder (optional)
# Version: 1.0.0 / 2026-10-31
# Author:  HaGeZi
# Docs:
#   https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
#
# Alternative to server.conf: instead of resolving recursively from the root,
# Unbound forwards all queries encrypted (DNS over TLS) to Quad9 and caches
# the answers; Cloudflare Security can be added as a second provider.
# Unbound never contacts the root servers or any authoritative server
# itself.
#
# Differences to server.conf:
# - Privacy: the forwarder sees every query (encrypted on the way).
# - DNSSEC is validated by the forwarder, not locally; a bogus answer
#   arrives as SERVFAIL, but answers carry no AD flag from this Unbound.
#   The root.key file (unbound-anchor) is not needed.
# - DNSSEC test of the installation guide: fail01.dnssec.works still returns
#   SERVFAIL, but dig +ad dnssec.works shows no "ad" flag.
#
# The comments name the RFC an option is based on. The configuration is RFC
# compliant; options with Unbound's default value are left out, except where
# the value is security or RFC relevant (kept to document the intent).
#
# Minimum:     Unbound 1.20 (discard-timeout). Older versions need this
#              option removed; further options by version: ede,
#              ede-serve-expired 1.16; tcp-reuse-timeout,
#              max-reuse-tcp-queries 1.13.2; infra-keep-probing 1.13.
# Recommended: the latest Unbound release (security fixes), at least
#              1.25.2 (fix for CVE-2026-56444, see discard-timeout).
#              Option names checked against the Unbound 1.26.2 source.
#
# Always check the configuration before starting or restarting Unbound;
# an invalid file stops Unbound from starting:
#   sudo unbound-checkconf /etc/unbound/unbound.conf
#   sudo systemctl restart unbound
# -------------------------------------------------------------------------
server:
    # ---------------------------------------------------------------------
    # Interface and process
    # ---------------------------------------------------------------------
    # Only reachable locally, e.g. as upstream for Pi-hole (127.0.0.1#5335).
    # Unbound's default access control allows localhost and refuses all
    # other clients.
    interface: 127.0.0.1
    port: 5335
    # Run in the foreground, the service manager (systemd) handles it
    do-daemonize: no
    # One thread (default, set explicitly because the slabs below depend on
    # it) is plenty for a home network and keeps all queries on the same
    # TLS connections (each thread opens its own).
    num-threads: 1
    # One cache slab per thread. Without these lines Unbound would use at
    # least 4 slabs, which only pays off with several threads. When raising
    # num-threads, remove these three lines.
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1

    # ---------------------------------------------------------------------
    # Logging and statistics
    # ---------------------------------------------------------------------
    # Log every SERVFAIL with its reason
    log-servfail: yes
    # Readable timestamps instead of Unix time
    log-time-ascii: yes
    # Detailed statistics for unbound-control stats
    extended-statistics: yes

    # ---------------------------------------------------------------------
    # Extended DNS Errors
    # ---------------------------------------------------------------------
    # Reason of a failure in the reply (RFC 8914)
    ede: yes
    # EDE 3 "Stale Answer" for expired data from the cache (RFC 8914, RFC 8767)
    ede-serve-expired: yes

    # ---------------------------------------------------------------------
    # Modules
    # ---------------------------------------------------------------------
    # iterator only: no local DNSSEC validation, the forwarder validates
    # (DNSSEC: RFC 4033, RFC 4034, RFC 4035). As recommended by Quad9 for
    # forwarders, there is also no trust anchor (auto-trust-anchor-file).
    module-config: "iterator"
    # QNAME minimisation (RFC 9156) only helps privacy when resolving from
    # the root. Quad9 recommends disabling it on forwarders; Unbound already
    # sends forwarded queries with the full name, this makes it explicit.
    qname-minimisation: no

    # ---------------------------------------------------------------------
    # Transport
    # ---------------------------------------------------------------------
    # EDNS UDP payload size (RFC 6891). 1232 bytes avoids IP fragmentation
    # (DNS Flag Day 2020); RFC 9715 recommends at most 1400 bytes, smaller
    # values allowed. Larger answers switch to TCP (RFC 7766).
    edns-buffer-size: 1232
    max-udp-size: 1232
    # Accept large queries, they are legal with EDNS (RFC 6891)
    harden-large-queries: no
    # Ignore EDNS buffer sizes below 512 bytes (RFC 6891)
    harden-short-bufsize: yes
    # TCP/TLS connections to the forwarders (RFC 7766, RFC 7858)
    outgoing-num-tcp: 256
    # Keep the TLS connections to the forwarders open and reuse them, so the
    # TLS handshake (1-2 extra round trips) is only needed rarely: idle
    # connections stay open for 2 min (default 1 min) and carry up to 1000
    # queries (default 200) before they are renewed.
    tcp-reuse-timeout: 120000
    max-reuse-tcp-queries: 1000

    # ---------------------------------------------------------------------
    # DNS over TLS
    # ---------------------------------------------------------------------
    # CA bundle to verify the certificates of the forwarders, required for
    # authentication by name (strict privacy profile, RFC 8310). Path for
    # Debian/Ubuntu; other systems: adjust the path or use
    # "tls-system-cert: yes" (Unbound 1.16 or later) instead.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # ---------------------------------------------------------------------
    # Forwarder availability and timeouts
    # ---------------------------------------------------------------------
    # Keep probing forwarders marked as down, so they are back in use quickly
    infra-keep-probing: yes
    # Drop the UDP reply of a query still unanswered after 5 s; resolution
    # continues and the result is cached for the retry. The default of
    # 1900 ms protects public resolvers against DNSBomb (CVE-2024-33655).
    # Only localhost can query here, so 5 s lets slow answers still reach
    # Pi-hole, matching the default 5 s timeout of the glibc stub resolver.
    # Must be larger than serve-expired-client-timeout (1.8 s).
    # Unbound 1.25.2 and later fix CVE-2026-56444 (discard-timeout combined
    # with serve-expired-client-timeout).
    discard-timeout: 5000

    # ---------------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------------
    # TTLs from the answers are used as they are (RFC 1035, RFC 2181).
    # Upper limit for TTLs (3 days). Capping is allowed, RFC 8767 recommends
    # a cap of at most 7 days (604800 s)
    cache-max-ttl: 259200
    # Upper limit for negative answers (1 h), RFC 2308: 1 to 3 hours
    cache-max-negative-ttl: 3600
    # Cache sizes; the RRset cache should be about twice the message cache
    msg-cache-size: 128m
    rrset-cache-size: 256m
    # Refresh popular entries before they expire (last 10 % of their TTL)
    prefetch: yes

    # ---------------------------------------------------------------------
    # Serve stale data (RFC 8767)
    # ---------------------------------------------------------------------
    serve-expired: yes
    # Try a fresh answer for 1.8 s before answering with expired data,
    # as recommended by RFC 8767
    serve-expired-client-timeout: 1800
    # TTL of expired answers, RFC 8767 recommends 30 s
    serve-expired-reply-ttl: 30
    # Do not extend the stale period when an expired entry is served
    serve-expired-ttl-reset: no
    # Serve data at most 1 day after expiry, RFC 8767 suggests 1 to 3 days
    serve-expired-ttl: 86400

    # ---------------------------------------------------------------------
    # Query handling and privacy
    # ---------------------------------------------------------------------
    # Do not answer id.server, hostname.bind and version.bind (RFC 4892)
    hide-identity: yes
    hide-version: yes

    # ---------------------------------------------------------------------
    # DNS rebinding protection
    # ---------------------------------------------------------------------
    # Public answers that contain private or special-use addresses are
    # removed. The mechanism itself is not defined by an RFC; every address
    # range below is specified by an RFC and listed in the IANA special-
    # purpose address registries (RFC 6890).
    # Comment out a range if it is used for public names in your network
    # (e.g. CGNAT for Tailscale) or add further ranges in the same format.
    # "This network" (RFC 1122, RFC 6890)
    private-address: 0.0.0.0/8
    # Private networks (RFC 1918)
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    # Shared address space / CGNAT (RFC 6598) - breaks Tailscale
    # private-address: 100.64.0.0/10
    # Loopback (RFC 1122)
    private-address: 127.0.0.0/8
    # Link local (RFC 3927)
    private-address: 169.254.0.0/16
    # IPv6 loopback, link local and IPv4-mapped addresses (RFC 4291)
    private-address: ::1/128
    private-address: fe80::/10
    private-address: ::ffff:0:0/96
    # IPv6 unique local addresses (RFC 4193)
    private-address: fc00::/7

    # Exceptions: these domains (incl. all subdomains) may return private
    # addresses. Each one weakens the rebinding protection for that domain,
    # so only enable what is needed: remove the leading "#" of the line.
    # Add further domains in the same format if necessary.
    #
    # DNS blocklists (DNSBL/RHSBL) answer with 127.0.0.x. Only needed if a
    # mail server or spam filter (rspamd, SpamAssassin) uses this resolver.
    # Note: many DNSBLs refuse queries that arrive via large public
    # resolvers such as Quad9 or Cloudflare; use server.conf for that.
    # private-domain: "zen.spamhaus.org"
    # private-domain: "dbl.spamhaus.org"
    # private-domain: "bl.spamcop.net"
    # private-domain: "b.barracudacentral.org"
    # private-domain: "bl.mailspike.net"
    # private-domain: "psbl.surriel.com"
    # private-domain: "multi.uribl.com"
    # private-domain: "multi.surbl.org"
    #
    # Wi-Fi calling (VoWiFi): ePDG names of the mobile operators,
    # epdg.epc.mnc<MNC>.mcc<MCC>.pub.3gppnetwork.org. Normally public
    # addresses; only needed if an operator returns private ones.
    # private-domain: "pub.3gppnetwork.org"
    #
    # Plex: plex.direct resolves to the LAN address of the Plex server,
    # needed for direct connections inside the local network.
    # private-domain: "plex.direct"
    #
    # Developer services that resolve to any IP address or to 127.0.0.1
    # private-domain: "nip.io"
    # private-domain: "sslip.io"
    # private-domain: "localtest.me"
    # private-domain: "lvh.me"

# -------------------------------------------------------------------------
# Remote control (unbound-control) on 127.0.0.1, default port 8953
# -------------------------------------------------------------------------
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1

# -------------------------------------------------------------------------
# Forwarders
# -------------------------------------------------------------------------
# All queries go to Quad9 via DNS over TLS on port 853 (RFC 7858). The name
# after "#" is checked against the certificate of the forwarder (RFC 8310).
# Quad9 blocks malware domains and validates DNSSEC.
# The configuration follows Quad9's DNS forwarder best practices: Quad9
# only, both addresses of one service, caching on, no local DNSSEC
# validation, no QNAME minimisation.
# Optional: enable the Cloudflare Security lines as a second provider, which
# also blocks malware and validates DNSSEC. Unbound then spreads the queries
# over all addresses by response time, so each provider sees only part of
# the queries and one provider can fail without interruption. Quad9 is then
# no longer the only upstream, unlike its best practices recommend.
# Every address needs its own TLS connection, so few addresses mean more
# reuse and fewer handshakes. Other DoT providers can be used in the same
# format: forward-addr: <IP>@853#<name in the certificate>
# The IPv6 addresses are commented out for two reasons:
# - TLS performance: they would double the number of addresses and thus of
#   TLS connections and handshakes, and each connection is reused less.
#   IPv4 alone is enough for a home network.
# - Not every network has working IPv6: without it, Unbound would still
#   try them and run into timeouts until it marks them as down.
# Enable them if IPv4 is not available or IPv6 is preferred, and only if
# this host reaches the internet via IPv6 (test: ping -6 -c 3 2620:fe::fe).
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Never fall back to unencrypted recursion if the forwarders fail
    forward-first: no

    # Quad9: malware blocking, no ECS
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    # forward-addr: 2620:fe::fe@853#dns.quad9.net
    # forward-addr: 2620:fe::9@853#dns.quad9.net

    # Cloudflare Security: malware blocking only (optional, see above)
    # forward-addr: 1.1.1.2@853#security.cloudflare-dns.com
    # forward-addr: 1.0.0.2@853#security.cloudflare-dns.com
    # forward-addr: 2606:4700:4700::1112@853#security.cloudflare-dns.com
    # forward-addr: 2606:4700:4700::1002@853#security.cloudflare-dns.com
